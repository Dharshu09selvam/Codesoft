<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendation System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }
        .container {
            width: 50%;
            margin: auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        input[type="text"] {
            padding: 10px;
            width: 80%;
            font-size: 16px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .recommendations {
            margin-top: 30px;
        }
        .recommendations ul {
            list-style-type: none;
            padding: 0;
        }
        .recommendations li {
            background-color: #e6e6e6;
            margin: 5px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .error {
            color: red;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Movie Recommendation System</h1>
        <form method="POST" action="/recommend">
            <input type="text" name="movie_title" placeholder="Enter a movie title..." required>
            <br>
            <button type="submit">Get Recommendations</button>
        </form>

        {% if title %}
            <h2>Recommended Movies based on "{{ title }}"</h2>
            <div class="recommendations">
                <ul>
                    {% for movie in recommendations %}
                        <li>{{ movie }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}

        {% if message %}
            <div class="error"><strong>{{ message }}</strong></div>
        {% endif %}
    </div>

</body>
</html>
